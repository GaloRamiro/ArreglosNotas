<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="ejercicio1.js"></script>
    <script src="utilitarios.js"></script>

    <!-- CSS externo -->
    <link rel="stylesheet" href="ejercicios1.css" />

    <title>Arreglos</title>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h2 class="titulo">Ingreso de Nota</h2>

        <input
          type="text"
          id="ingresoNota"
          class="input-grande"
          placeholder="0"
        />

        <div class="botones">
          <input
            type="button"
            value="AGREGAR NOTA"
            class="btn btn-primario"
            onclick="probarAgregar()"
          />

          <input
            type="button"
            value="IMPRIMIR"
            class="btn btn-secundario"
            onclick="recuperarDato()"
          />

          <input
            type="button"
            value="PROMEDIO"
            class="btn btn-secundario"
            onclick="promedionotas()"
          />

          <input
            type="button"
            value="PRUEBA"
            class="btn btn-terciario"
            onclick="agregarElementos()"
          />
        </div>
      </div>
    </div>
    <p class="autor">Autor: Galo Cisneros</p>
  </body>
</html>
